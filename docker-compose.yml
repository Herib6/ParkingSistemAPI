version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ParkingSystem123!
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - parking-network

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      - parking-network
    environment:
      - ADMINER_DEFAULT_SERVER=sqlserver

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - parking-network
    command: ["--smtp-auth-allow-insecure"]

volumes:
  sqlserver_data:

networks:
  parking-network:
    driver: bridge
